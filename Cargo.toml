[workspace]
members = [".", "logger"]

[package]
name = "firehose-geyser-plugin"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashbrown = "0.15"
ahash = "0.8"
rustc-hash = "2.0"
lazy_static = "1.5.0"
tokio = "1.41.0"
bincode = "1.3.3"
log = "0.4.22"
prost-types = "0.11"
prost = "0.11.9"
rbase64 = "2.0.3"
serde_json = "1.0.132"
serde = { version = "1.0.215", features = ["derive"] }
env_logger = "0.11"
gxhash = "3.4.1"
hex = "0.4.3"
bs58 = "0.5"
solana-hash = "4.2.0"
solana-pubkey = "4.1.0"
solana-signature = "3.3.0"

agave-geyser-plugin-interface = "=4.0.0"
solana-rpc-client = "=4.0.0"
solana-rpc-client-api = "=4.0.0"
solana-transaction-status = "=4.0.0"
solana-transaction-context = "=4.0.0"
solana-commitment-config = "3.1.1"
solana-message = "3.1.0"
solana-program = "4.0.0"
solana-transaction = "3.1.0"

[dev-dependencies]
tempfile = "3.10.1"
wiremock = "0.5.22"
pretty_assertions = { version = "1.4.1", default-features = false, features = [
    "alloc",
] }
criterion = { version = "0.5", features = ["html_reports"] }
testing_logger = "0.1"

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "startup_benchmark"
harness = false

[[bench]]
name = "fixed_length_benchmark"
harness = false
