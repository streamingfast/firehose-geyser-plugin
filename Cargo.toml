[workspace]
members = [".", "logger"]

[package]
name = "firehose-geyser-plugin"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashbrown = "0.15"
ahash = "0.8"
rustc-hash = "2.0"
lazy_static = "1.5.0"
tokio = "1.41.0"
bincode = "1.3.3"
log = "0.4.22"
prost-types = "0.11"
prost = "0.11.9"
rbase64 = "2.0.3"
serde_json = "1.0.132"
serde = { version = "1.0.215", features = ["derive"] }
solana-sdk = "3.0.0"
env_logger = "0.9.3"
gxhash = "3.4.1"
hex = "0.4.3"

# Needs to be bumped in sync
agave-geyser-plugin-interface = "=3.1.12"
solana-rpc-client = "=3.1.12"
solana-rpc-client-api = "=3.1.12"
solana-transaction-status = "=3.1.12"
solana-transaction-context = "=3.1.12"

# Seems that those ones is not always following others ...
solana-commitment-config = "3.0"
solana-message = "3.0"
solana-program = "3.0"
solana-transaction = "3.0"

[dev-dependencies]
tempfile = "3.10.1"
wiremock = "0.5.22"
pretty_assertions = { version = "1.4.1", default-features = false, features = [
    "alloc",
] }
criterion = { version = "0.5", features = ["html_reports"] }
testing_logger = "0.1"

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "startup_benchmark"
harness = false

[[bench]]
name = "fixed_length_benchmark"
harness = false

[[bench]]
name = "fxhash_vs_ahash_benchmark"
harness = false
