version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all:
        patterns: ["*"]
    ignore:
      # The Agave/Solana crates are pinned to match the validator build this
      # plugin is loaded into (see the "Chain Update" section of AGENTS.md and
      # the SOLANA_TAG argument in the Dockerfile). Bumping them independently
      # of the validator image silently breaks that alignment and nothing in CI
      # catches it, so they must only move as part of a deliberate chain update.
      - dependency-name: "agave-*"
      - dependency-name: "solana-*"
