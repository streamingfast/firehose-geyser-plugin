name: Release

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: streamingfast/firehose-geyser-plugin

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=
          flavor: |
            # Only promote :latest on non-prerelease tags (no beta/rc).
            latest=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    steps:
      - name: Set Env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extract changelog section
        id: changelog
        run: |
          curl -L https://github.com/streamingfast/sfreleaser/releases/download/v0.13.1/sfreleaser_linux_x86_64.tar.gz | tar -xz
          chmod +x sfreleaser

          # sfreleaser's default version pattern is a substring match
          # (^## .*version.*), which incorrectly resolves e.g. v4.2.0-rc.0 to
          # the section ## v4.2.0-rc.0-fh3.0-1. Force an exact header match.
          escaped_version=$(python3 -c 'import re,sys; print(re.escape(sys.argv[1]))' "$RELEASE_VERSION")

          ./sfreleaser changelog extract-section \
            "github://token:${{ github.token }}@${{ github.repository }}/$GITHUB_SHA/CHANGELOG.md" \
            --start-header-regex="^## ${escaped_version}$" \
            --github-output="changelog:$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
        run: |
          {
            printf '%s\n' "$CHANGELOG"
            echo ""
            echo "### Docker image"
            echo ""
            echo "This release is published as a Docker image **for solana-devnet only**:"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}"
            echo '```'
            echo ""
            echo "For production workloads, build the plugin natively on the target host"
            echo "(or with matching CPU features) so the \`.so\` can use host-optimal"
            echo "instructions. The image is built with a portable feature set and is not"
            echo "intended as the production binary."
          } > RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          # No release assets: the architecture-specific plugin is built manually for production.
